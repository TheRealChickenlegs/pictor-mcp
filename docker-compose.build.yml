# pictor-mcp - build from source instead of pulling the published image.
#
# Overlay for contributors and for anyone who needs a local modification. The
# default compose path pulls a prebuilt image from GHCR; this is the opt-out.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# The image name is overridden to a local tag so a build can never overwrite a
# published tag in the registry by accident.
#
# Picking the variant
# -------------------
# `BUILD_TARGET` selects the Dockerfile stage, and it has to match the image you
# mean to run - otherwise you get a working CPU image under a CUDA tag:
#
#   BUILD_TARGET=default -> the CPU image        (with docker-compose.yml alone)
#   BUILD_TARGET=gpu     -> plus PyTorch CUDA    (with docker-compose.gpu.yml)
#   BUILD_TARGET=ml      -> plus rembg + u2net   (with docker-compose.ml.yml)
#
# `LOCAL_IMAGE_TAG` names the result. Give each variant its own tag, or building
# the ML image silently replaces the CPU image you were running. The two are
# independent variables because Compose cannot derive one from the other:
#
#   BUILD_TARGET=gpu LOCAL_IMAGE_TAG=local-gpu
#
# So, to build and run the local GPU image:
#
#   BUILD_TARGET=gpu LOCAL_IMAGE_TAG=local-gpu docker compose \
#     -f docker-compose.yml \
#     -f docker-compose.gpu.yml \
#     -f docker-compose.build.yml \
#     up -d --build
#
# `scripts/build_image.sh` (or `make build-gpu`) does the same thing with the
# matching tag, a cache-friendly invocation and a post-build smoke test, then
# prints the .env lines for it. That is the easier path.
#
# Building where Portainer can see it
# -----------------------------------
# A build here writes the image into the local Docker daemon. A stack that names
# the same local tag - `IMAGE_REPO=pictor-mcp` plus `IMAGE_TAG=local` in .env -
# then needs no registry and no download at all. To have Portainer run the build
# itself, on the host it manages, see docs/portainer.md and
# scripts/portainer_build.sh.
#
# Why rebuilds are cheap
# ----------------------
# The dependency layers (CUDA wheels, the ML model) sit *below* `COPY src/` in
# the Dockerfile, so a source edit rebuilds one small layer, and the pip cache
# mount behind the big installs means even a forced reinstall of them comes off
# the local disk. Read the note at the top of the Dockerfile before reordering
# anything.

services:
  pictor-mcp:
    build:
      context: .
      # Must match the variant you are deploying. Defaults to the CPU image.
      target: ${BUILD_TARGET:-default}
      # Override the CUDA build for the gpu/ml stages. Leave TORCH_VERSION empty
      # (the default) to take the newest build the index publishes for the base
      # image's Python; set it only to pin an exact version.
      # args:
      #   TORCH_INDEX_URL: "https://download.pytorch.org/whl/cu129"
      #   TORCH_VERSION: "2.14.0"
    image: pictor-mcp:${LOCAL_IMAGE_TAG:-local}
