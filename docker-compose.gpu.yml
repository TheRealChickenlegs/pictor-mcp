# Overlay for the CPU compose file that turns the deployment into a GPU one.
#
#   mkdir -p input output && chown 10001:10001 output
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Merge semantics: this file only *adds* the GPU build target, the device
# reservations and the GPU environment; everything else (ports, volumes,
# hardening) still comes from docker-compose.yml, so the two files cannot drift
# apart on security settings.
#
# Requires the NVIDIA Container Toolkit on the host:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
# `gpus: all` is the Compose v2 form and is used here. The older Swarm-style form
# is deliberately NOT given alongside it: Compose normalises `gpus` into
# `deploy.resources.reservations.devices` internally, and supplying both has been
# known to trip a "conflicting device requests" error. If you are on a Compose
# version without `gpus`, comment it out and uncomment the `deploy:` block below
# each service instead.

services:
  pictor-mcp:
    build:
      context: .
      target: gpu
    image: pictor-mcp:gpu
    environment:
      # auto = use CUDA when torch can see a device, otherwise stay on the CPU
      # path. Set to `torch` to make a missing GPU a hard failure instead.
      PICTOR_GPU: ${PICTOR_GPU:-auto}
    gpus: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Keeps the profiled service consistent when someone combines the overlay with
  # `--profile gpu`; it is already a GPU service in the base file.
  pictor-mcp-gpu:
    build:
      context: .
      target: gpu
    environment:
      PICTOR_GPU: ${PICTOR_GPU:-auto}
    gpus: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
