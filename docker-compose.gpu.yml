# pictor-mcp - GPU overlay.
#
# Switches the deployment from the CPU image to the CUDA image and passes the
# host's NVIDIA devices through to the container.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Prerequisites on the host:
#   * an NVIDIA GPU and a recent driver  (check with `nvidia-smi`)
#   * the NVIDIA Container Toolkit:
#     https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#   * verify with:  docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 nvidia-smi
#
# Without the toolkit, `up` fails with "could not select device driver". That is
# a host configuration problem, not a problem with the image: install the
# toolkit or use the CPU image.
#
# What the GPU actually accelerates, so you can tell whether it is working:
#   * resampling (resize) above PICTOR_GPU_MIN_PIXELS
#   * ML background removal, with the ml overlay
#   * NOT encoding - libjpeg-turbo and libwebp have no CUDA path and are already
#     fast on the CPU
#
# Confirm from inside the running container:
#   docker compose exec pictor-mcp python -m pictor_mcp --check | grep -i accel
# or ask the server by calling the image_capabilities tool.

services:
  pictor-mcp:
    # The GPU image is published as :gpu and as :<version>-gpu. Pin the version
    # for a reproducible deployment: IMAGE_TAG_GPU=1.0.0-gpu
    image: ${IMAGE_REPO:-ghcr.io/therealchickenlegs/pictor-mcp}:${IMAGE_TAG_GPU:-gpu}

    environment:
      # auto  = use CUDA when torch can see a device, otherwise fall back to the
      #         CPU path. Safe on a host without a GPU, so it is the default.
      # torch = require CUDA and fail at startup if it is unavailable. Use this
      #         if silently falling back to the CPU would be a nasty surprise.
      PICTOR_GPU: ${PICTOR_GPU:-auto}

    # `gpus: all` is the Compose v2 form. It is deliberately the only device
    # request here: Compose normalises it into
    # deploy.resources.reservations.devices internally, and supplying both has
    # been known to trip a "conflicting device requests" error. On a Compose
    # version without `gpus`, comment it out and uncomment the block below.
    gpus: all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
