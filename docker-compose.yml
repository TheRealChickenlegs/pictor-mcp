# pictor-mcp - CPU deployment (default) with an optional GPU service.
#
#   mkdir -p input output && chown 10001:10001 output
#   cp .env.example .env          # then edit .env and set PICTOR_AUTH_TOKEN
#   docker compose up -d --build
#
# Reachable at http://127.0.0.1:8077/mcp (health: http://127.0.0.1:8077/healthz).
#
# GPU instead of CPU:
#   docker compose --profile gpu up -d --build
# or, to add the GPU reservation to the default service:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Do not use the `gpu` profile and the overlay together: they both publish the
# same host port and would collide.

# ---------------------------------------------------------------------------
# Shared environment. Defined once as a YAML anchor and merged into both
# services, so the CPU and GPU paths cannot drift apart - a security setting
# that silently applied to only one of them would be a real bug.
#
# Every value is `${VAR:-default}` so a .env file or the shell can override any
# of them without editing this file. The defaults are the secure ones: no URL
# fetching, no output serving, no credentials baked anywhere.
# ---------------------------------------------------------------------------
x-pictor-environment: &pictor-environment
  # --- transport / bind ----------------------------------------------------
  PICTOR_TRANSPORT: ${PICTOR_TRANSPORT:-streamable-http}
  # 0.0.0.0 inside the container is required for the published port to reach it;
  # the port mapping below is what actually restricts reachability.
  PICTOR_HOST: ${PICTOR_HOST:-0.0.0.0}
  PICTOR_PORT: ${PICTOR_PORT:-8077}
  PICTOR_STREAMABLE_HTTP_PATH: ${PICTOR_STREAMABLE_HTTP_PATH:-/mcp}
  # Session behaviour. The SDK auto-negotiates per connection: modern
  # (2026-07-28) requests are served statelessly and legacy clients still get the
  # initialize handshake, so these defaults suit every current client.
  PICTOR_STATELESS_HTTP: ${PICTOR_STATELESS_HTTP:-true}
  PICTOR_JSON_RESPONSE: ${PICTOR_JSON_RESPONSE:-false}
  PICTOR_LOG_LEVEL: ${PICTOR_LOG_LEVEL:-INFO}

  # --- filesystem jail -----------------------------------------------------
  PICTOR_INPUT_ROOTS: ${PICTOR_INPUT_ROOTS:-/data/input}
  PICTOR_OUTPUT_ROOT: ${PICTOR_OUTPUT_ROOT:-/data/output}
  PICTOR_FONT_DIRS: ${PICTOR_FONT_DIRS:-/usr/share/fonts}

  # --- authentication ------------------------------------------------------
  # Empty means UNAUTHENTICATED. Generate one with `openssl rand -hex 32`; the
  # server refuses tokens shorter than 16 characters.
  PICTOR_AUTH_TOKEN: ${PICTOR_AUTH_TOKEN:-}
  PICTOR_URL_SECRET: ${PICTOR_URL_SECRET:-}
  PICTOR_URL_TTL_SECONDS: ${PICTOR_URL_TTL_SECONDS:-3600}

  # --- DNS-rebinding / origin allow-lists ----------------------------------
  # These must match the address clients actually use. The defaults suit the
  # loopback port mapping below; if you expose the port on a LAN address, set
  # both to that address (and its http:// origin) in .env.
  PICTOR_DNS_REBINDING_PROTECTION: ${PICTOR_DNS_REBINDING_PROTECTION:-true}
  PICTOR_ALLOWED_HOSTS: ${PICTOR_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*,127.0.0.1:8077,localhost:8077}
  PICTOR_ALLOWED_ORIGINS: ${PICTOR_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*}
  PICTOR_ENABLE_HSTS: ${PICTOR_ENABLE_HSTS:-false}
  # Per-request access log. Off by default because signed /files/ URLs carry
  # their HMAC in the query string, making a logged line a usable credential
  # for the link's lifetime. Application logs are always on.
  PICTOR_HTTP_ACCESS_LOG: ${PICTOR_HTTP_ACCESS_LOG:-false}

  # --- output serving ------------------------------------------------------
  # Requires PICTOR_AUTH_TOKEN or PICTOR_URL_SECRET; the server refuses to start
  # otherwise, so generated files are never world-readable. Set
  # PICTOR_PUBLIC_BASE_URL when the externally visible hostname or port differs
  # from the bind address, otherwise generated URLs point at 127.0.0.1:<port>.
  PICTOR_SERVE_OUTPUTS: ${PICTOR_SERVE_OUTPUTS:-false}
  PICTOR_PUBLIC_BASE_URL: ${PICTOR_PUBLIC_BASE_URL:-}

  # --- outbound URL fetching (SSRF-guarded, off by default) ---------------
  PICTOR_ALLOW_NET_FETCH: ${PICTOR_ALLOW_NET_FETCH:-false}
  PICTOR_FETCH_ALLOWED_HOSTS: ${PICTOR_FETCH_ALLOWED_HOSTS:-}
  PICTOR_FETCH_ALLOWED_PORTS: ${PICTOR_FETCH_ALLOWED_PORTS:-80,443}
  PICTOR_FETCH_MAX_BYTES: ${PICTOR_FETCH_MAX_BYTES:-33554432}
  PICTOR_FETCH_MAX_REDIRECTS: ${PICTOR_FETCH_MAX_REDIRECTS:-3}
  PICTOR_FETCH_TIMEOUT_SECONDS: ${PICTOR_FETCH_TIMEOUT_SECONDS:-15}
  PICTOR_FETCH_VERIFY_TLS: ${PICTOR_FETCH_VERIFY_TLS:-true}

  # --- resource limits (decompression-bomb guards) -------------------------
  PICTOR_MAX_PIXELS: ${PICTOR_MAX_PIXELS:-64000000}
  PICTOR_MAX_FILE_BYTES: ${PICTOR_MAX_FILE_BYTES:-67108864}
  PICTOR_MAX_DIMENSION: ${PICTOR_MAX_DIMENSION:-24000}
  PICTOR_MAX_FRAMES: ${PICTOR_MAX_FRAMES:-120}
  # Bounds the *product* of frames and pixels: a multi-frame image is decoded
  # into one full bitmap per frame before re-encoding, so per-frame and
  # frame-count limits alone still allow an unbounded total allocation.
  PICTOR_MAX_ANIMATION_PIXELS: ${PICTOR_MAX_ANIMATION_PIXELS:-128000000}
  PICTOR_MAX_OUTPUT_PIXELS: ${PICTOR_MAX_OUTPUT_PIXELS:-256000000}
  PICTOR_MAX_REQUEST_BODY_BYTES: ${PICTOR_MAX_REQUEST_BODY_BYTES:-50331648}
  PICTOR_MAX_EXIF_BYTES: ${PICTOR_MAX_EXIF_BYTES:-65536}
  PICTOR_MAX_CONCURRENCY: ${PICTOR_MAX_CONCURRENCY:-4}
  PICTOR_MAX_BATCH_FILES: ${PICTOR_MAX_BATCH_FILES:-64}
  PICTOR_OP_TIMEOUT_SECONDS: ${PICTOR_OP_TIMEOUT_SECONDS:-120}
  PICTOR_MAX_INPUT_BASE64_BYTES: ${PICTOR_MAX_INPUT_BASE64_BYTES:-50331648}
  PICTOR_MAX_INLINE_IMAGE_BYTES: ${PICTOR_MAX_INLINE_IMAGE_BYTES:-1048576}

  # --- image pipeline behaviour -------------------------------------------
  PICTOR_STRIP_METADATA: ${PICTOR_STRIP_METADATA:-true}
  PICTOR_INLINE_IMAGES: ${PICTOR_INLINE_IMAGES:-true}
  PICTOR_GPU_MIN_PIXELS: ${PICTOR_GPU_MIN_PIXELS:-4000000}
  PICTOR_BG_MODEL: ${PICTOR_BG_MODEL:-u2net}
  # Where rembg keeps its ONNX weights; the `ml` image bakes u2net in at this
  # path. Only models preseeded there work offline.
  U2NET_HOME: ${U2NET_HOME:-/opt/models}

  # Keep interpreter and native-library caches on the tmpfs below, never on the
  # read-only root filesystem.
  PYTHONDONTWRITEBYTECODE: "1"
  HOME: /tmp
  NUMBA_CACHE_DIR: /tmp

# Memory ceiling, shared by both services.
#
# Worst case per operation is roughly PICTOR_MAX_PIXELS x ~16 bytes: a 64 MP
# image is 192 MB as RGB and 256 MB as RGBA, and the float intermediates used by
# resize, compare and saliency run 4-8 bytes per channel per pixel with two or
# three live at once. At the default PICTOR_MAX_CONCURRENCY=4 that is a few
# gigabytes. If you lower this limit, lower PICTOR_MAX_CONCURRENCY or
# PICTOR_MAX_PIXELS to match: an OOM kill takes the server down for every client.
x-pictor-limits: &pictor-limits
  restart: unless-stopped
  # The image needs no writable root: the package is installed read-only and all
  # writes go to /data/output. This turns any accidental write, or a compromised
  # dependency trying to plant a persistence file, into a hard failure.
  read_only: true
  # The only scratch space. Pillow's atomic writes happen in the output directory
  # (see security/paths.PathJail), not here, so this stays small. mode=1777
  # matches a normal /tmp so every uid can use it.
  tmpfs:
    - /tmp:size=256m,mode=1777
  # Drop every Linux capability. The service binds port 8077 (>1024, so it does
  # not need CAP_NET_BIND_SERVICE) and never changes uid, so it needs none.
  cap_drop:
    - ALL
  # Blocks setuid/setgid binaries from granting privileges, so a foothold inside
  # the container cannot be escalated.
  security_opt:
    - no-new-privileges:true
  # Bounds fork bombs; a handful of uvicorn threads is all this ever needs.
  pids_limit: 256
  mem_limit: 4g
  # Swap capped at the same value so the kernel cannot hide an OOM behind disk.
  memswap_limit: 4g
  # Redundant with the image's USER, but belt-and-braces: even if the image is
  # replaced by a root-running one, this forces the unprivileged uid.
  user: "10001:10001"

# Volume mounts, shared by both services.
x-pictor-volumes: &pictor-volumes
  # ./input must exist on the host before `up`. It is mounted read-only so a
  # compromised server cannot corrupt or plant files among your originals.
  - ./input:/data/input:ro
  # ./output must exist and be writable by uid 10001 (the `pictor` user):
  #   mkdir -p input output && chown 10001:10001 output
  # The server exits at startup with a clear message if it cannot write here,
  # rather than failing later on the first tool call.
  - ./output:/data/output

services:
  pictor-mcp:
    # Build locally from this checkout. To use the published image instead,
    # delete the `build:` block and uncomment the line below.
    build:
      context: .
      target: base
    image: pictor-mcp:latest
    # image: ghcr.io/OWNER/pictor-mcp:latest
    container_name: pictor-mcp

    # Loopback-only by default. This is the single most important deployment
    # setting: with it, nothing off-host can reach the server even if
    # PICTOR_AUTH_TOKEN is unset. To expose it on your LAN, change the left-hand
    # side to the host address you want (e.g. "192.168.1.10:8077:8077") and then
    # also set PICTOR_ALLOWED_HOSTS and PICTOR_ALLOWED_ORIGINS in .env to that
    # address, because the browser's Host header will no longer match the
    # loopback allow-list. Never expose it without a token.
    ports:
      - "127.0.0.1:8077:8077"

    volumes: *pictor-volumes

    environment:
      <<: *pictor-environment
      # No torch in the CPU image, so acceleration is explicitly off rather than
      # spending startup time discovering that.
      PICTOR_GPU: ${PICTOR_GPU:-off}

    <<: *pictor-limits

    # Explicit copy of the image healthcheck so the behaviour is visible and
    # overridable at the deployment layer.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8077/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # GPU variant, behind a profile so a plain `docker compose up -d` never tries
  # to build a multi-gigabyte CUDA image or schedule a GPU that may not exist:
  #   docker compose --profile gpu up -d --build
  #
  # This service and the CPU one publish the same host port, so they are
  # alternatives. Enabling the profile starts only this service, which is why no
  # port change is needed.
  pictor-mcp-gpu:
    profiles: ["gpu"]
    build:
      context: .
      target: gpu
    image: pictor-mcp:gpu
    container_name: pictor-mcp-gpu

    ports:
      - "127.0.0.1:8077:8077"

    volumes: *pictor-volumes

    environment:
      <<: *pictor-environment
      # auto = use CUDA only when torch can actually see a device, and fall back
      # to the CPU path otherwise, so the same image runs on a host without one.
      PICTOR_GPU: ${PICTOR_GPU:-auto}

    <<: *pictor-limits

    # Expose every GPU to the container. `gpus: all` is the Compose v2 form;
    # docker-compose.gpu.yml also adds the classic deploy.resources form.
    gpus: all

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8077/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
